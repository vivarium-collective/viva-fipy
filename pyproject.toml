[project]
name = "viva-fipy"
version = "0.1.0"
description = "The genuine FiPy finite-volume engine as reusable primitives + a general reaction-advection-diffusion process-bigraph process."
requires-python = ">=3.12"
dependencies = ["process-bigraph", "bigraph-schema", "fipy>=4.0", "numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["viva_fipy"]

[tool.uv.sources]
process-bigraph = { git = "https://github.com/vivarium-collective/process-bigraph.git", branch = "main" }
